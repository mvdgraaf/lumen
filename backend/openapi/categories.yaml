openapi: 3.1.0
info:
  title: "Lumen Backstage API"
  version: 0.1.0

paths:
  /categories:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - Categories
      summary: List all categories
      responses:
        '200':
          description: A list of categories.
        '404':
          description: No categories found.

    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Categories
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: true
              properties:
                name:
                  type: string
            example:
              name: "Speaker"
      responses:
        '201':
          description: The category was created.
        '400':
          description: Invalid request data.

  /categories/{id}:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - Categories
      summary: Get a category by ID
      parameters:
        - name: id
          in: path
          description: The ID of the categ ory to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The category details.
        '404':
          description: Category not found.

    patch:
      security:
        - bearerAuth: [ ]
      tags:
        - Categories
      summary: Edit a category
      parameters:
        - name: id
          in: path
          description: The ID of the category to edit.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
            example:
              name: "Speaker"
      responses:
        '200':
          description: The category was edited.
        '400':
          description: Invalid request data.
        '404':
          description: Category not found.

    delete:
      security:
        - bearerAuth: [ ]
      tags:
        - Categories
      summary: Delete a category
      parameters:
        - name: id
          in: path
          description: The ID of the category to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The category was deleted.
        '400':
          description: Invalid request data.
        '404':
          description: Category not found.
