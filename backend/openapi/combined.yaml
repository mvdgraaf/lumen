  /categories:
    get:
      tags:
        - Categories
      summary: 'List all categories'
      responses:
        '200':
          description: 'A list of categories.'
        '404':
          description: 'No categories found.'
    post:
      tags:
        - Categories
      summary: 'Create a category'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: true
              properties:
                name:
                  type: string
            example:
              name: Speaker
      responses:
        '201':
          description: 'The category was created.'
        '400':
          description: 'Invalid request data.'
  '/categories/{id}':
    get:
      tags:
        - Categories
      summary: 'Get a category by ID'
      parameters:
        -
          name: id
          in: path
          description: 'The ID of the categ ory to retrieve.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The category details.'
        '404':
          description: 'Category not found.'
    patch:
      tags:
        - Categories
      summary: 'Edit a category'
      parameters:
        -
          name: id
          in: path
          description: 'The ID of the category to edit.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
            example:
              name: Speaker
      responses:
        '200':
          description: 'The category was edited.'
        '400':
          description: 'Invalid request data.'
        '404':
          description: 'Category not found.'
    delete:
      tags:
        - Categories
      summary: 'Delete a category'
      parameters:
        -
          name: id
          in: path
          description: 'The ID of the category to delete.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The category was deleted.'
        '404':
          description: 'Category not found.'
  /products:
    get:
      security:
        -
          bearerAuth: []
      tags:
        - Products
      summary: 'List all products'
      parameters:
        -
          name: categoryId
          in: query
          required: false
          schema:
            type: string
        -
          name: brand
          in: query
          required: false
          schema:
            type: string
        -
          name: modelNumber
          in: query
          required: false
          schema:
            type: string
        -
          name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - SIMPLE
              - BULK
              - BUNDLE
              - KIT
      responses:
        '200':
          description: 'A list of products.'
        '404':
          description: 'No products found.'
    post:
      security:
        -
          bearerAuth: []
      tags:
        - Products
      summary: 'Create a product'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: true
              properties:
                SKU:
                  type: string
                name:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [SIMPLE, BULK, BUNDLE, KIT]
                  default: SIMPLE
                brand:
                  type: string
                modelNumber:
                  type: string
                dayPrice:
                  type: number
                  format: decimal
                quantity:
                  type: integer
                  default: 0
                categoryId:
                  type: string
            example:
              name: 'Shure SM58'
              brand: Shure
              type: SIMPLE
              dayPrice: 15
              quantity: 10
              categoryId: b3f1c2a0-1234-4a5b-9c6d-abcdef123456
      responses:
        '201':
          description: 'The product was created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Invalid request data.'
